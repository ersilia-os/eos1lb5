Interpretation: Six rank scores calibrated against the Ersilia reference library
  of 50K compounds, where 0.65 beats 99% of it. They cover lung fluid entry, 
  caseum diffusion and mycobacterial cell wall permeation across four datasets. 
  Each keeps its authors cut-off, so the scores are not comparable.
