Title: Mycobacterium cell wall penetration
Description: Estimates how far a compound penetrates the necrotic and cellular compartments
  of tuberculosis lesions, where bacilli survive out of reach of many drugs. Sarathy
  and colleagues measured partitioning of antitubercular agents into caseum and cellular
  lesion material in infected rabbits, then related it to physicochemical character,
  finding that lipophilicity and plasma protein binding largely govern caseum access.
  Six lesion compartments are scored separately. Measurements derive from an animal
  model, so absolute values transfer to human disease only approximately.
